<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارێکتەری دەق و ڤیدیۆ - دەرک مۆد</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #475569;
            --primary: #38bdf8;
            --box-bg: #334155;
            --box-text: #e0f2fe;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        h2 {
            color: var(--primary);
            margin-top: 0;
            font-size: 24px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }

        img, video {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
            object-fit: cover;
        }

        .text-box {
            background: var(--box-bg);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 17px;
            color: var(--box-text);
            font-weight: bold;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>✨ نموونەی وێنە و ڤیدیۆ</h2>
        
        <p>وێنەی کارێکتەر:</p>
        <img src="YOUR_IMAGE_LINK.jpg" alt="وێنەی کارێکتەر">

        <div class="text-box">
            "سڵاو! ئەمە ئەو دەقەیە کە من دەیڵێم."
        </div>

        <p style="margin-top: 25px;">ڤیدیۆی کارێکتەرەکە:</p>
        <video controls>
            <source src="YOUR_VIDEO_LINK.mp4" type="video/mp4">
            وێبگەڕەکەی تۆ پشتگیری ڤیدیۆ ناکات.
        </video>
    </div>

</body>
</html>
